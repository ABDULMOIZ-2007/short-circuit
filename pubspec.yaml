name: short_circuit
description: A pocket circuit lab with a Flutter interface and C++17 simulation core.
publish_to: none
version: 0.5.0+5
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  short_circuit_core:
    path: packages/short_circuit_core
  path_provider: ^2.1.6
  flutter_svg: ^2.2.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/brand/
    - assets/symbols/
    - assets/textures/
    - examples/


  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: SCMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
